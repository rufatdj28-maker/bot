<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTML/CSS Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #0f1115);
    color: var(--tg-theme-text-color, #ffffff);
    padding: 16px;
    min-height: 100vh;
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, #1c1f26);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.sub { color: var(--tg-theme-hint-color, #8a8f98); font-size: 14px; margin-bottom: 16px; }
  .stats-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--tg-theme-hint-color, #8a8f98);
    margin-bottom: 10px;
  }
  .timer { font-weight: 600; }
  .timer.warning { color: #ff5b5b; }
  .progress-bar {
    height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px;
    overflow: hidden; margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%; background: var(--tg-theme-button-color, #4c8dff);
    transition: width 0.3s ease;
  }
  .question { font-size: 17px; font-weight: 600; margin-bottom: 18px; line-height: 1.4; }
  .option {
    display: block; width: 100%; text-align: left;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--tg-theme-text-color, #ffffff);
    padding: 14px 16px; border-radius: 12px;
    font-size: 15px; margin-bottom: 10px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option:active { background: rgba(255,255,255,0.12); }
  .option.correct { background: rgba(76, 217, 100, 0.18); border-color: #4cd964; }
  .option.wrong { background: rgba(255, 91, 91, 0.18); border-color: #ff5b5b; }
  .option.disabled { pointer-events: none; opacity: 0.85; }
  .explanation {
    font-size: 13.5px; color: var(--tg-theme-hint-color, #8a8f98);
    background: rgba(255,255,255,0.04); border-radius: 10px;
    padding: 12px 14px; margin-top: 8px; line-height: 1.4;
  }
  .btn-primary {
    display: block; width: 100%; text-align: center;
    background: var(--tg-theme-button-color, #4c8dff);
    color: var(--tg-theme-button-text-color, #ffffff);
    padding: 14px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  .center { text-align: center; }
  .big-emoji { font-size: 48px; margin-bottom: 8px; }
  .result-score { font-size: 32px; font-weight: 700; margin: 8px 0; }
  .result-line { font-size: 14px; color: var(--tg-theme-hint-color, #8a8f98); margin: 4px 0; }
  #screen-loading { text-align: center; padding-top: 60px; color: var(--tg-theme-hint-color, #8a8f98); }
  #screen-error { text-align: center; padding-top: 60px; color: #ff5b5b; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="screen-loading">Yuklanmoqda...</div>
<div id="screen-error" class="hidden">Savollarni yuklab bo'lmadi. Internetni tekshiring va sahifani qayta oching.</div>

<div id="screen-intro" class="card hidden">
  <h1>📋 Bilim testi</h1>
  <p class="sub" id="intro-sub"></p>
  <button class="btn-primary" id="btn-start">🚀 Testni boshlash</button>
</div>

<div id="screen-quiz" class="card hidden">
  <div class="stats-row">
    <span id="progress-label"></span>
    <span class="timer" id="timer-label"></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="question" id="question-text"></div>
  <div id="options-container"></div>
  <div id="explanation-box" class="explanation hidden"></div>
  <button class="btn-primary hidden" id="btn-next">Keyingi savol ➡️</button>
</div>

<div id="screen-result" class="card hidden center">
  <div class="big-emoji" id="result-emoji">🎉</div>
  <div id="result-title" style="font-size:18px;font-weight:600;"></div>
  <div class="result-score" id="result-score"></div>
  <div class="result-line" id="result-correct"></div>
  <div class="result-line" id="result-time"></div>
  <div class="result-line" id="result-save-status"></div>
  <button class="btn-primary" id="btn-close">Yopish</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let QUESTIONS = [];
let SCORE_PER_QUESTION = 5;
let TOTAL_TIME_SECONDS = 900;
let MAX_SCORE = 0;

let activeQuestions = [];
let current = 0;
let score = 0;
let correctCount = 0;
let startTime = null;
let timerInterval = null;
let answered = false;

const $ = (id) => document.getElementById(id);

function showScreen(id) {
  ["screen-loading","screen-error","screen-intro","screen-quiz","screen-result"].forEach(s => {
    $(s).classList.toggle("hidden", s !== id);
  });
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(sec) {
  sec = Math.max(0, sec);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,"0")}`;
}

async function loadQuestions() {
  try {
    const res = await fetch("/api/questions");
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    QUESTIONS = data.questions;
    SCORE_PER_QUESTION = data.score_per_question;
    TOTAL_TIME_SECONDS = data.total_time_seconds;
    MAX_SCORE = data.max_score;

    if (!QUESTIONS.length) {
      showScreen("screen-error");
      $("screen-error").textContent = "Hozircha savollar mavjud emas.";
      return;
    }

    $("intro-sub").textContent =
      `${QUESTIONS.length} ta savol, har biri ${SCORE_PER_QUESTION} ball. Vaqt: ${Math.floor(TOTAL_TIME_SECONDS/60)} daqiqa.`;
    showScreen("screen-intro");
  } catch (e) {
    showScreen("screen-error");
  }
}

function startQuiz() {
  activeQuestions = shuffle(QUESTIONS);
  current = 0; score = 0; correctCount = 0; answered = false;
  startTime = Date.now();
  showScreen("screen-quiz");
  startTimer();
  renderQuestion();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const remaining = TOTAL_TIME_SECONDS - elapsed;
    const label = $("timer-label");
    label.textContent = "⏱ " + formatTime(remaining);
    label.classList.toggle("warning", remaining <= 60);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      finishQuiz(true);
    }
  }, 1000);
}

function renderQuestion() {
  answered = false;
  const item = activeQuestions[current];
  $("progress-label").textContent = `Savol ${current+1} / ${activeQuestions.length} · ${score}/${MAX_SCORE} ball`;
  $("progress-fill").style.width = `${(current/activeQuestions.length)*100}%`;
  $("question-text").textContent = item.q;
  $("explanation-box").classList.add("hidden");
  $("btn-next").classList.add("hidden");

  const container = $("options-container");
  container.innerHTML = "";
  item.opts.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = `${String.fromCharCode(65+i)}) ${opt}`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const item = activeQuestions[current];
  const buttons = document.querySelectorAll("#options-container .option");
  buttons.forEach((b, i) => {
    b.classList.add("disabled");
    if (i === item.correct) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
  });

  if (idx === item.correct) {
    score += SCORE_PER_QUESTION;
    correctCount += 1;
  }

  const box = $("explanation-box");
  box.textContent = (idx === item.correct ? "✅ To'g'ri! " : "❌ Noto'g'ri. ") + (item.exp || "");
  box.classList.remove("hidden");

  $("progress-label").textContent = `Savol ${current+1} / ${activeQuestions.length} · ${score}/${MAX_SCORE} ball`;

  const nextBtn = $("btn-next");
  nextBtn.textContent = (current + 1 >= activeQuestions.length) ? "Natijani ko'rish 🏁" : "Keyingi savol ➡️";
  nextBtn.classList.remove("hidden");

  if (tg.HapticFeedback) {
    tg.HapticFeedback.notificationOccurred(idx === item.correct ? "success" : "error");
  }
}

function nextQuestion() {
  current += 1;
  if (current >= activeQuestions.length) {
    finishQuiz(false);
  } else {
    renderQuestion();
  }
}

async function finishQuiz(timedOut) {
  if (timerInterval) clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now() - startTime) / 1000);

  $("result-emoji").textContent = timedOut ? "⏰" : "🎉";
  $("result-title").textContent = timedOut ? "Vaqt tugadi!" : "Test yakunlandi!";
  $("result-score").textContent = `${score} / ${MAX_SCORE}`;
  $("result-correct").textContent = `✅ To'g'ri javoblar: ${correctCount} / ${activeQuestions.length}`;
  $("result-time").textContent = `⏱ Sarflangan vaqt: ${formatTime(elapsed)}`;
  $("result-save-status").textContent = "Natija saqlanmoqda...";
  showScreen("screen-result");

  try {
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        initData: tg.initData,
        score: score,
        correct: correctCount,
        total: activeQuestions.length,
        elapsed: elapsed
      })
    });
    const result = await res.json();
    $("result-save-status").textContent = result.ok ? "✅ Natija saqlandi" : "⚠️ Natijani saqlab bo'lmadi";
  } catch (e) {
    $("result-save-status").textContent = "⚠️ Natijani saqlab bo'lmadi";
  }
}

$("btn-start").addEventListener("click", startQuiz);
$("btn-next").addEventListener("click", nextQuestion);
$("btn-close").addEventListener("click", () => tg.close());

loadQuestions();
</script>
</body>
</html>
